services:
  mysql:
    image: mysql:8.0
    container_name: reporte-vias-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reporte_vias
      MYSQL_USER: reportevias
      MYSQL_PASSWORD: reportevias
      MYSQL_ROOT_PASSWORD: root_reportevias
    ports:
      - "3306:3306"
    volumes:
      - mysql_reporte_vias:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_reporte_vias:
